name: Verify and deploy static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify the public file set
        run: python3 scripts/validate_site.py
      - name: Check release readiness
        id: release
        run: |
          if grep -r -q 'RELEASE_BLOCKER_' site --include='*.html'; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Publishing withheld while legal review or the external support route is pending."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload static files
        if: steps.release.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: needs.verify.outputs.publish == 'true'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
